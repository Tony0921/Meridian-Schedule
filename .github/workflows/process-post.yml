name: Process X post

on:
  repository_dispatch:
    types: [new_x_post]
  workflow_dispatch:
    inputs:
      source:
        type: choice
        options: [x]
        default: x
      post_id:
        type: string
        required: true
      member_id:
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

# 不使用單一全域 concurrency queue，避免不同貼文的 pending run 被取代。
concurrency:
  group: post-${{ github.event.client_payload.post_id || inputs.post_id }}
  cancel-in-progress: false

jobs:
  process:
    if: vars.ENABLE_LEGACY_API_PIPELINE == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      X_API_TOKEN: ${{ secrets.X_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.SCHEDULE_BOT_TOKEN || github.token }}
      REVIEW_ALL: ${{ vars.REVIEW_ALL || 'true' }}
      AUTO_MERGE_CONFIDENCE: ${{ vars.AUTO_MERGE_CONFIDENCE || '0.95' }}
      PR_CONFIDENCE: ${{ vars.PR_CONFIDENCE || '0.70' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - id: parse
        run: python -m scripts.process_event
      - if: steps.parse.outputs.candidate == 'true'
        run: python -m scripts.publish_proposal .local/event/proposal.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: post-${{ github.run_id }}
          path: .local/event/*.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
