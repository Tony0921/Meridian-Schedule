name: Reconcile X posts

on:
  schedule:
    - cron: '0 22,10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X_API_TOKEN: ${{ secrets.X_API_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.SCHEDULE_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/cache/restore@v4
        with:
          path: .local/collector.db*
          key: reconcile-${{ github.run_id }}
          restore-keys: reconcile-
      - run: python -m collector.main reconcile
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .local/collector.db*
          key: reconcile-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconcile-${{ github.run_id }}
          path: .local/collector.db*
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
